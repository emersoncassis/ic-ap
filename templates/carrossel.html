<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  :root{--bg:#0e1116;--fg:#f3f1ea;--mut:#9aa3ad;--acc:#ff7a1a}
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1350px;background:var(--bg);color:var(--fg);
    font-family:"Inter","Segoe UI","Helvetica Neue",Arial,sans-serif}
  .card{width:1080px;height:1350px;padding:84px 84px 72px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:20px;color:var(--mut);font-size:30px}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--acc)}
  .top b{color:var(--fg);font-weight:700}.top .n{margin-left:auto;font-size:28px}
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
  h1{font-size:{{ '104px' if tipo=='capa' else '78px' }};line-height:1.04;letter-spacing:-1.5px;font-weight:800}
  .rule{width:120px;height:8px;background:var(--acc);margin:44px 0}
  .body{overflow:hidden;font-size:{{ '46px' if tipo=='capa' else '44px' }};line-height:1.38;color:#e4e1d8;max-height:620px}
  .body p+p{margin-top:24px}
  .foot{display:flex;justify-content:space-between;border-top:2px solid #232a33;padding-top:30px;font-size:28px;color:var(--mut)}
  .cta{color:var(--acc);font-weight:700}
</style></head>
<body><div class="card">
  <div class="top"><span class="dot"></span><b>{{ nome }}</b><span>{{ handle }}</span><span class="n">{{ idx }}/{{ total }}</span></div>
  <div class="mid">
    <h1>{{ titulo }}</h1>
    {% if paragrafos %}<div class="rule"></div><div class="body">{% for p in paragrafos %}<p>{{ p }}</p>{% endfor %}</div>{% endif %}
  </div>
  <div class="foot"><span class="{{ 'cta' if tipo=='cta' }}">{{ 'Arraste →' if tipo=='capa' else ('Salve e compartilhe' if tipo=='cta' else '') }}</span><span>{{ handle }}</span></div>
</div></body></html>
