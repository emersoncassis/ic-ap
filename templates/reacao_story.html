<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  :root{--bg:#0e1116;--fg:#f3f1ea;--mut:#9aa3ad;--acc:#ff7a1a}
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1920px;background:var(--bg);color:var(--fg);
    font-family:"Inter","Segoe UI","Helvetica Neue",Arial,sans-serif}
  /* zonas seguras do Story: ~250px no topo e ~340px embaixo ficam sob a interface do app */
  .card{width:1080px;height:1920px;padding:250px 72px 340px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:20px;color:var(--mut);font-size:30px}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--acc)}
  .top b{color:var(--fg);font-weight:700}
  h1{margin-top:44px;font-size:76px;line-height:1.05;letter-spacing:-1.5px;font-weight:800}
  .print{margin-top:36px;border-radius:20px;overflow:hidden;border:2px solid #232a33;height:380px}
  .print img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
  .rule{width:120px;height:8px;background:var(--acc);margin:36px 0}
  .body{flex:1;overflow:hidden;font-size:40px;line-height:1.36;color:#e4e1d8}
  .body p+p{margin-top:22px}
  .foot{margin-top:24px;font-size:28px;color:var(--mut)}
</style></head>
<body><div class="card">
  <div class="top"><span class="dot"></span><b>{{ nome }}</b><span>{{ handle }}</span></div>
  <h1>{{ manchete }}</h1>
  {% if print_uri %}<div class="print"><img src="{{ print_uri }}" alt=""></div>{% endif %}
  <div class="rule"></div>
  <div class="body">{% for p in paragrafos %}<p>{{ p }}</p>{% endfor %}</div>
  {% if fonte %}<div class="foot">Fonte: {{ fonte }}</div>{% endif %}
</div></body></html>
