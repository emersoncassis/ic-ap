<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  :root{--acc:#ff7a1a}
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:{{ altura|default(1920) }}px;background:transparent;font-family:"Inter","Segoe UI","Helvetica Neue",Arial,sans-serif}
  /* zonas seguras do Story: ~250px no topo e ~340px embaixo ficam sob a interface do app */
  .scrim{position:absolute;left:0;right:0;bottom:0;height:{{ (altura|default(1920) * 0.47)|int }}px;background:linear-gradient(to top,rgba(8,10,14,.86) 0%,rgba(8,10,14,.62) 45%,rgba(8,10,14,0) 100%)}
  .box{position:absolute;left:72px;right:72px;bottom:{{ base|default(370) }}px}
  .rule{width:120px;height:8px;background:var(--acc);margin-bottom:34px}
  .txt{color:#f6f4ee;font-size:{{ tamanho }}px;line-height:1.12;font-weight:800;letter-spacing:-1px;text-shadow:0 3px 24px rgba(0,0,0,.55)}
  .by{margin-top:30px;color:#c9ced6;font-size:30px;font-weight:600}
  .men{margin-top:28px;display:flex;flex-wrap:wrap;gap:14px}.men span{background:rgba(255,255,255,.92);color:#111;font-weight:800;font-size:44px;padding:8px 24px;border-radius:14px}
  {{ marca_css|safe }}
  html,body{background:transparent}
</style></head>
<body><div class="scrim"></div>
<div class="box">{% if texto %}<div class="rule"></div><div class="txt">{{ texto }}</div>{% endif %}{% if mencoes %}<div class="men">{% for m in mencoes %}<span>{{ m }}</span>{% endfor %}</div>{% endif %}{% if handle %}<div class="by">{{ handle }}</div>{% endif %}</div>
</body></html>
