{% extends "base.html" %}{% block title %}Entrar · ic-ap{% endblock %}
{% block body %}
<div class="card" style="max-width:380px;margin:80px auto 0">
  <h1>ic-ap</h1><p class="sub">Painel de conteúdo</p>
  {% if erro %}<div class="flash erro">{{ erro }}</div>{% endif %}
  <form method="post" action="/login">
    <label>Senha</label><input type="password" name="senha" autofocus required>
    <div class="acts"><button type="submit">Entrar</button></div>
  </form>
  <div style="margin-top:16px;text-align:center;border-top:1px solid var(--line);padding-top:12px">
    <p style="font-size:12px;color:var(--mut)">Esqueceu a senha? No computador onde o ic-ap roda, execute:<br>
      <code>docker compose exec app python -m app.reset_senha</code></p>
  </div>
</div>
{% endblock %}
