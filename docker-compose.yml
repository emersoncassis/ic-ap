# Esteira local ic-ap. Requer Docker Desktop (WSL2) com suporte a GPU NVIDIA.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama_models:/root/.ollama]
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: all, capabilities: [gpu]}

  app:
    build: ./services/app
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
    ports: ["127.0.0.1:8000:8000"]   # painel: só local. Acesso externo, só via Cloudflare Access (outro hostname)
    depends_on: [ollama]
    volumes:
      - ./data:/data
      - ./templates:/srv/card-templates:ro
      - ./context:/context:ro
      - ./config:/config:ro

  # Serve só a pasta de imagens temporárias. É isto que o túnel expõe.
  public:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./data/public:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [public]

volumes:
  ollama_models:
